<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E86DE"/><stop offset="1" stop-color="#0B3D6B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- water -->
  <g fill="none" stroke="#9CD3FF" stroke-width="30" stroke-linecap="round" opacity="0.9">
    <path d="M120 780 q 60 -40 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0"/>
    <path d="M180 870 q 60 -40 120 0 t 120 0 t 120 0 t 120 0 t 120 0" opacity="0.55"/>
  </g>
  <!-- hull -->
  <path d="M150 700 L 874 700 L 820 745 L 204 745 Z" fill="#FFFFFF"/>
  <!-- rower -->
  <g fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso: hips to shoulders, leaning back on the finish -->
    <path d="M560 660 L 470 470"/>
    <!-- legs: hips to knee to foot-stretcher -->
    <path d="M560 660 L 650 560 L 760 640"/>
    <!-- arm to oar handle -->
    <path d="M470 470 L 600 440"/>
    <!-- oar: handle through oarlock down into water -->
    <path d="M600 440 L 360 760" stroke-width="34"/>
  </g>
  <!-- blade -->
  <path d="M330 790 l 60 -45 l 40 30 l -70 60 z" fill="#FFFFFF"/>
  <!-- head -->
  <circle cx="440" cy="385" r="60" fill="#FFFFFF"/>
</svg>
