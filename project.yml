name: ErgSoft
options:
  bundleIdPrefix: com.mbsoft
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "6TJKVTB5Y8"
    CODE_SIGN_STYLE: Automatic
targets:
  ErgSoft:
    type: application
    platform: iOS
    scheme:
      testTargets: []
    sources:
      - ErgSoft
      - path: ErgSoft/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ErgSoftWatch
    info:
      path: ErgSoft/Resources/Info.plist
      properties:
        CFBundleDisplayName: ErgSoft
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSBluetoothAlwaysUsageDescription: ErgSoft connects to your rower, bike or ski erg and heart rate strap over Bluetooth.
        NSHealthShareUsageDescription: ErgSoft reads heart rate to show it during workouts.
        NSHealthUpdateUsageDescription: ErgSoft saves your completed workouts to Apple Health.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
    entitlements:
      path: ErgSoft/Resources/ErgSoft.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mbsoft.ergsoft
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ErgSoftWatch:
    type: application
    platform: watchOS
    scheme:
      testTargets: []
    sources: [ErgSoftWatch]
    dependencies:
      - target: ErgSoftWatchWidget
        embed: true
    info:
      path: ErgSoftWatch/Info.plist
      properties:
        CFBundleDisplayName: ErgSoft
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mbsoft.ergsoft
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: ErgSoft streams your heart rate to the iPhone app during workouts.
        NSHealthUpdateUsageDescription: ErgSoft records your erg workouts.
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: ErgSoftWatch/ErgSoftWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mbsoft.ergsoft.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ErgSoftWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [ErgSoftWatchWidget]
    info:
      path: ErgSoftWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: ErgSoft
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mbsoft.ergsoft.watchkitapp.widget
        SKIP_INSTALL: YES
